---
layout: default
---

<h2 style="font-size: 16px; font-family: Helvetica, sans-serif; color: darkred; margin-bottom: 20px">Blog Posts</h2>
  {% for post in site.posts %}
    <p>
      <span style="font-size: 12px; color: gray;font-family: 'Courier New';">{{ post.date | date: "%d %b %Y" }}</span>
      &raquo; <a href="{{ post.url }}" style="font-size: 14px; font-family:Helvetica, sans-serif">{{ post.title }}</a>
    </p>
  {% endfor %}
