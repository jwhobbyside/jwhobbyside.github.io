---
layout: default
---

<h1 class="post-title">Blog Posts</h1>
  {% for post in site.posts %}
    <p>
      <span style="font-size: 12px; color: gray;font-family: 'Courier New';">{{ post.date | date: "%Y %b %d" }}</span>
      &raquo; <a href="{{ post.url }}" style="font-size: 14px; font-family:Helvetica, sans-serif">{{ post.title }}</a>
    </p>
  {% endfor %}
