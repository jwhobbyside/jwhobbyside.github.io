---
layout: default
---

<h2 style="font-size: 18px; font-family: Helvetica, sans-serif; color: darkred">Blog Posts</h2>
  {% for post in site.posts %}
    <p>
      <span style="color: gray;font-style: "Courier New"">{{ post.date | date: "%d %b %Y" }}</span>
      &raquo; <a href="{{ post.url }}" style="font-family:Helvetica, sans-serif">{{ post.title }}</a>
    </p>
  {% endfor %}
